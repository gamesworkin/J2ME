<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RetroJava Cloud Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logo"><span>RETRO</span>JAVA</div>
        <div class="status-badge" id="status">Engine Ready</div>
    </header>

    <main class="container">
        <section class="emulator-zone">
            <div class="screen-wrapper">
                <div id="player-container" style="width: 240px; height: 320px;"></div>
                
                <div id="loading-overlay" class="hidden">
                    <div class="spinner"></div>
                    <p>Alocando RAM...</p>
                </div>
            </div>
        </section>

        <section class="control-panel">
            <div class="panel-card">
                <h3>Carregar Jogo (.jar)</h3>
                <input type="file" id="rom-upload" accept=".jar">
                <label for="rom-upload" class="custom-file-upload">Selecionar do PC</label>
            </div>

            <div class="panel-card">
                <h3>Biblioteca</h3>
                <div class="games-grid">
                    <button class="game-card" data-url="roms/bounce.jar">Bounce Tales</button>
                    <button class="game-card" data-url="roms/sonic.jar">Sonic Advance</button>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/emulatorjs@latest/dist/emulator.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
